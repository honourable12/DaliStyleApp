services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Required for Lambda/RDS/EKS simulation
      - ./floci/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
  
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-daily_style}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-daily_style}
      STORAGE_TYPE: s3
      S3_ENDPOINT_URL: http://floci:4566
      S3_EXTERNAL_ENDPOINT_URL: http://localhost:4566
      S3_BUCKET: daily-style-assets
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AI_SERVICE_URL: http://ai-service:8001
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      - db

  ai-service:
    build: ./ai-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
      - /app/.venv
      - ai_models:/models
    environment:
      HF_HOME: /models
      MODEL_PATH: /models
      YOLO_CONFIG_DIR: /tmp
      PYTHONUNBUFFERED: 1

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  ai_models:
