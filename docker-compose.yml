services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-daily_style}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-daily_style}
      S3_BUCKET: ${S3_BUCKET}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      - db

  ai-service:
    build: ./ai-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
      - /app/.venv
      - ai_models:/models
    environment:
      HF_HOME: /models
      MODEL_PATH: /models

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  ai_models:
