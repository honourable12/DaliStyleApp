[project]
name = "daily-style-backend"
version = "0.1.0"
description = "Backend for Daily Style Fashion"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt==3.2.0",
    "boto3",
    "requests",
    "python-multipart",
    "pydantic-settings",
    "pydantic[all,email]>=2.13.3",
]
