[project]
name = "daily-style-ai-service"
version = "0.1.0"
description = "AI Service for Daily Style Fashion"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "opencv-python-headless",
    "numpy",
    "scikit-learn",
    "transformers",
    "torch==2.6.0",
    "python-multipart>=0.0.26",
    "pillow>=12.2.0",
    "ultralytics>=8.4.41",
    "torchvision==0.21.0",
    ]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
